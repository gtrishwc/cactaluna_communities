<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Reportes | Cacta Luna Communities</title>

<link rel="stylesheet" href="../style.css">


<style>

body{
    background:#f5f7fa;
    font-family:Arial, Helvetica, sans-serif;
    margin:0;
}



/* NAVEGACION */

.app-nav{

    background:white;
    display:flex;
    gap:20px;
    padding:15px 25px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);

}


.app-nav a{

    text-decoration:none;
    color:#444;
    font-weight:bold;

}


.app-nav .activo{

    color:#1e7a4d;

}




.main{

    max-width:1100px;
    margin:auto;
    padding:20px;

}




.topbar{

    background:white;
    padding:25px;
    border-radius:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 8px 20px rgba(0,0,0,.08);

}



.topbar h1{

    margin:0;
    color:#1e7a4d;

}



.profile{

    display:flex;
    align-items:center;
    gap:10px;

}



.avatar{

    width:45px;
    height:45px;
    border-radius:50%;
    background:#2E8B57;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:20px;

}




.panel{

    background:white;
    margin-top:25px;
    padding:30px;
    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);

}



.panel h2{

    color:#1e7a4d;

}



.campo{

    margin-bottom:20px;

}



.campo label{

    display:block;
    font-weight:bold;
    margin-bottom:8px;

}



input,
select,
textarea{


    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    box-sizing:border-box;
    font-size:15px;


}



textarea{

    height:120px;
    resize:none;

}



.btn{


    width:100%;
    background:#2E8B57;
    color:white;
    border:none;
    padding:15px;
    border-radius:30px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;


}



.btn:hover{

    background:#1e7a4d;

}



.prioridad{

    display:flex;
    gap:20px;

}



.info{

    margin-top:20px;
    background:#fff8e6;
    border-left:5px solid #ffc107;
    padding:15px;
    border-radius:10px;

}




@media(max-width:700px){


.topbar{

    flex-direction:column;
    gap:20px;

}


.app-nav{

    overflow:auto;

}


}


</style>


</head>


<body>
