<script>

const URL_APP_SCRIPT = "https://script.google.com/macros/s/AKfycbyE0cjTI0KaBss_Cnk7BXGD4SQhsGretJhRQc4qfBuaTTFteGGtTy-xmDboAZObcZRqIw/exec";


function enviarReporte(){


let datos = {

nombre: document.getElementById("nombre").value,

correo: document.getElementById("correo").value,

telefono: document.getElementById("telefono").value,

tipo: document.getElementById("tipo").value,

descripcion: document.getElementById("descripcion").value,

ubicacion: document.getElementById("ubicacion").value,

prioridad: document.querySelector('input[name="prioridad"]:checked')?.value || "Normal"

};



console.log("Datos enviados:", datos);



fetch(URL_APP_SCRIPT, {


method:"POST",


headers:{

"Content-Type":"application/json"

},


body:JSON.stringify(datos)


})


.then(respuesta => respuesta.json())


.then(resultado => {


console.log("Respuesta:", resultado);



if(resultado.estado === "ok"){


alert(

"✅ Reporte recibido correctamente\n\n" +

"Folio: " + resultado.folio + "\n\n" +

"El comité dará seguimiento a tu solicitud."

);



document.querySelector("form").reset();



}else{


alert(

"⚠️ No se pudo registrar el reporte:\n" +

resultado.mensaje

);


}



})


.catch(error => {


console.error("Error:",error);


alert(

"❌ Error al enviar el reporte. Intenta nuevamente."

);


});


}


</script>
